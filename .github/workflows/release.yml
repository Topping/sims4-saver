name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: make build
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: sims-saver-windows
          path: dist/Sims4-Save-Helper.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: sims-saver-macos
          path: dist/Sims4-Save-Helper.app

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate timestamp version
        id: version
        run: echo "version=$(date -u +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Archive macOS app
        run: |
          cd artifacts/sims-saver-macos
          zip -r ../Sims4-Save-Helper-macOS.zip Sims4-Save-Helper.app
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            artifacts/sims-saver-windows/Sims4-Save-Helper.exe \
            artifacts/Sims4-Save-Helper-macOS.zip \
            --title "Sims4 Save Helper - Build $VERSION" \
            --notes "Automated build $VERSION"
