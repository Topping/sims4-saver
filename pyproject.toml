[project]
name = "sims-saver"
version = "2.0.0"
description = "Auto-save utility for The Sims 4"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "psutil>=5.9.0",
    "pynput>=1.7.0",
    "rapidfuzz>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sims_saver"]

[project.scripts]
sims-saver = "sims_saver.main:main"
